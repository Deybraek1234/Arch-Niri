background: "#282828"
color: "#9D9083"
border: "#ADC62B"

menu:
  - key: "l"
    desc: Lock
    cmd: swaylock
  - key: "p"
    desc: Power off monitor and suspend
    cmd: swaylock & systemctl suspend-then-hibernate
  - key: "h"
    desc: Hibernate
    cmd: systemctl hibernate
  - key: "s"
    desc: Shutdown
    cmd: systemctl poweroff
  - key: "b"
    desc: Toggle Brightness
    cmd: pkill -x gammastep || gammastep -O 6500 -b 0.5 &
