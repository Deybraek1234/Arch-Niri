format = """
[](fg:#ADC62B)[ ](bg:#ADC62B fg:#ffffff)$directory[](bg:#6E655C fg:#ADC62B)$username[](bg:#1F4E2E fg:#6E655C)$hostname[](fg:#1F4E2E)$cmd_duration$jobs$git_branch$git_metrics$git_status$fill$time$line_break$character
"""

command_timeout = 2000
scan_timeout = 500
add_newline = true

[character]
success_symbol = "[λ](bold #598C39)"
error_symbol = "[Δ](bold #1F4E2E)"

[directory]
truncation_length = 3
truncation_symbol = ".../"
read_only = "  "
style = "bg:#ADC62B fg:#ffffff"
format = "[ $path ]($style)"

[fill]
symbol = " "

[cmd_duration]
min_time = 5
format = "[   $duration ](bold #ffffff)"

[hostname]
ssh_only = false
style = "bg:#1F4E2E fg:#ffffff"
format = "[ $hostname ]($style)"

[git_branch]
style = "fg:#ffffff"

[jobs]
symbol_threshold = 1
number_threshold = 2
symbol = "󱐌"
format = "[$symbol$number](bold #ffffff)"

[username]
show_always = true
style_user = "bg:#6E655C fg:#ffffff"
style_root = "bg:#4B3318 fg:#9D9083"
format = "[ $user ]($style)"

[time]
disabled = false
format = "[$time](#ffffff)"
use_12hr = true
time_format = "%T"
utc_time_offset = "local"

[sudo]
symbol = " 󰐼 "
disabled = false
format = "[$symbol](bold #1F4E2E)"

[line_break]
disabled = false
