format = """
[](fg:#F4ACF8)[ ](bg:#F4ACF8 fg:#ffffff)$directory[](bg:#717F84 fg:#F4ACF8)$username[](bg:#AB6C54 fg:#717F84)$hostname[](fg:#AB6C54)$cmd_duration$jobs$git_branch$git_metrics$git_status$fill$time$line_break$character
"""

command_timeout = 2000
scan_timeout = 500
add_newline = true

[character]
success_symbol = "[λ](bold #FFB05C)"
error_symbol = "[Δ](bold #AB6C54)"

[directory]
truncation_length = 3
truncation_symbol = ".../"
read_only = "  "
style = "bg:#F4ACF8 fg:#ffffff"
format = "[ $path ]($style)"

[fill]
symbol = " "

[cmd_duration]
min_time = 5
format = "[   $duration ](bold #ffffff)"

[hostname]
ssh_only = false
style = "bg:#AB6C54 fg:#ffffff"
format = "[ $hostname ]($style)"

[git_branch]
style = "fg:#ffffff"

[jobs]
symbol_threshold = 1
number_threshold = 2
symbol = "󱐌"
format = "[$symbol$number](bold #ffffff)"

[username]
show_always = true
style_user = "bg:#717F84 fg:#ffffff"
style_root = "bg:#567C8A fg:#A2B5BC"
format = "[ $user ]($style)"

[time]
disabled = false
format = "[$time](#ffffff)"
use_12hr = true
time_format = "%T"
utc_time_offset = "local"

[sudo]
symbol = " 󰐼 "
disabled = false
format = "[$symbol](bold #AB6C54)"

[line_break]
disabled = false
