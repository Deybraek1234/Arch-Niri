format = """
[](fg:#925159)[ ](bg:#925159 fg:#ffffff)$directory[](bg:#5F6062 fg:#925159)$username[](bg:#EC717A fg:#5F6062)$hostname[](fg:#EC717A)$cmd_duration$jobs$git_branch$git_metrics$git_status$fill$time$line_break$character
"""

command_timeout = 2000
scan_timeout = 500
add_newline = true

[character]
success_symbol = "[λ](bold #64B1ED)"
error_symbol = "[Δ](bold #EC717A)"

[directory]
truncation_length = 3
truncation_symbol = ".../"
read_only = "  "
style = "bg:#925159 fg:#ffffff"
format = "[ $path ]($style)"

[fill]
symbol = " "

[cmd_duration]
min_time = 5
format = "[   $duration ](bold #ffffff)"

[hostname]
ssh_only = false
style = "bg:#EC717A fg:#ffffff"
format = "[ $hostname ]($style)"

[git_branch]
style = "fg:#ffffff"

[jobs]
symbol_threshold = 1
number_threshold = 2
symbol = "󱐌"
format = "[$symbol$number](bold #ffffff)"

[username]
show_always = true
style_user = "bg:#5F6062 fg:#ffffff"
style_root = "bg:#21232B fg:#88898D"
format = "[ $user ]($style)"

[time]
disabled = false
format = "[$time](#ffffff)"
use_12hr = true
time_format = "%T"
utc_time_offset = "local"

[sudo]
symbol = " 󰐼 "
disabled = false
format = "[$symbol](bold #EC717A)"

[line_break]
disabled = false
